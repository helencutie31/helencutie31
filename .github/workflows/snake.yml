name: Generate Cosmic Contribution Snake

on:
  schedule:
    - cron: "0 2 * * *"   # runs once a day at 02:00 UTC
  workflow_dispatch: {}     # lets you trigger it manually anytime
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Helencutie31
          outputs: |
            assets/contribution-snake.svg?palette=github-dark
            assets/contribution-snake.svg?color_snake=%2367e8f9&color_dots=%2317,%237c3aed,%2367e8f9,%23f472b6,%23a78bfa

      - name: Commit snake SVG to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          git commit -m "chore: update cosmic contribution snake" || echo "no changes to commit"
          git push
