<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05040f"/>
      <stop offset="45%" stop-color="#0d0a2b"/>
      <stop offset="75%" stop-color="#170f3d"/>
      <stop offset="100%" stop-color="#231255"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <ellipse cx="220" cy="90" rx="380" ry="260" fill="url(#nebula1)"/>
  <ellipse cx="980" cy="240" rx="360" ry="240" fill="url(#nebula2)"/>
  <ellipse cx="640" cy="60" rx="300" ry="180" fill="url(#nebula3)"/>

  <!-- constellation network -->
  <g stroke="#8b9dff" stroke-width="1" opacity="0.55">
    <line x1="90" y1="70" x2="200" y2="130"/>
    <line x1="200" y1="130" x2="140" y2="220"/>
    <line x1="200" y1="130" x2="310" y2="90"/>
    <line x1="310" y1="90" x2="400" y2="180"/>
    <line x1="140" y1="220" x2="60" y2="270"/>
    <line x1="850" y1="60" x2="940" y2="110"/>
    <line x1="940" y1="110" x2="1040" y2="70"/>
    <line x1="940" y1="110" x2="1000" y2="200"/>
    <line x1="1000" y1="200" x2="1110" y2="240"/>
    <line x1="1000" y1="200" x2="900" y2="260"/>
    <line x1="780" y1="250" x2="900" y2="260"/>
    <line x1="60" y1="270" x2="140" y2="220"/>
  </g>
  <g fill="#c7d2fe">
    <circle cx="90" cy="70" r="2.4"/>
    <circle cx="200" cy="130" r="3"/>
    <circle cx="140" cy="220" r="2.2"/>
    <circle cx="310" cy="90" r="2.6"/>
    <circle cx="400" cy="180" r="2.2"/>
    <circle cx="60" cy="270" r="2"/>
    <circle cx="850" cy="60" r="2.2"/>
    <circle cx="940" cy="110" r="3"/>
    <circle cx="1040" cy="70" r="2.2"/>
    <circle cx="1000" cy="200" r="2.6"/>
    <circle cx="1110" cy="240" r="2.2"/>
    <circle cx="900" cy="260" r="2.4"/>
    <circle cx="780" cy="250" r="2"/>
  </g>

  <!-- twinkling stars scattered -->
  <g fill="#ffffff">
    <circle cx="45" cy="30" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="20" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="40" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="30" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="270" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="20" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="290" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="35" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="150" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="270" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="110" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="200" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="46" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)">HA LAN DO · HELEN</text>
  <text x="600" y="188" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" fill="#a5b4fc" opacity="0.85">// mapping ideas across the cosmic network</text>

  <!-- orbit ring accent -->
  <circle cx="600" cy="165" r="150" fill="none" stroke="#67e8f9" stroke-width="0.6" opacity="0.25"/>
  <circle cx="600" cy="165" r="190" fill="none" stroke="#a78bfa" stroke-width="0.6" opacity="0.18"/>
</svg>
